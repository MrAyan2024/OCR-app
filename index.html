<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Language OCR & PDF Reader</title>
    
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;700&family=Noto+Sans+Devanagari:wght@400;700&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            align-self: flex-start;
        }
        h1 { text-align: center; color: #333; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 25px; font-size: 14px; }
        
        .controls { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .controls select, .controls label {
            flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #ccc; font-size: 14px;
            display: flex; align-items: center; gap: 8px; min-width: 200px;
        }
        .controls input[type="checkbox"] { width: 18px; height: 18px; }

        .upload-area {
            border: 2px dashed #007bff;
            padding: 40px 20px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            background: #f8f9fa;
        }
        .upload-area:hover { background: #e9ecef; }
        #fileInput { display: none; }
        
        #imagePreview {
            max-width: 100%;
            max-height: 300px;
            display: none;
            margin: 20px auto;
            border-radius: 8px;
            border: 1px solid #ddd;
        }
        
        .btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            font-weight: bold;
        }
        .btn:hover:not(:disabled) { background: #0056b3; }
        .btn:disabled { background: #aaa; cursor: not-allowed; }
        
        .progress-bar {
            width: 100%; height: 8px; background: #eee; border-radius: 4px;
            margin-top: 15px; overflow: hidden; display: none;
        }
        .progress { height: 100%; background: #28a745; width: 0%; transition: width 0.2s; }
        
        .warning {
            background: #fff3cd; color: #856404; padding: 15px; border-radius: 6px;
            margin-top: 20px; display: none; text-align: center; font-weight: bold;
            border: 1px solid #ffeeba;
        }
        
        .output-area { margin-top: 25px; display: none; }
        .output-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        #extractedText {
            width: 100%;
            min-height: 300px;
            padding: 20px;
            font-size: 18px;
            line-height: 1.8;
            border: 1px solid #ddd;
            border-radius: 6px;
            resize: vertical;
            background: #fcfcfc;
            color: #000;
            font-family: 'Times New Roman', Times, serif; 
        }
        
        .font-bengali { font-family: 'Noto Sans Bengali', sans-serif !important; font-size: 20px !important; }
        .font-hindi { font-family: 'Noto Sans Devanagari', sans-serif !important; font-size: 20px !important; }
        
        .copy-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        .copy-btn:hover { background: #218838; }
    </style>
</head>
<body>

<div class="container">
    <h1>Universal OCR & PDF Reader</h1>
    <p class="subtitle">Supports Images, PDFs, Multiple Languages & Handwriting</p>
    
    <div class="controls">
        <select id="langSelect">
            <option value="eng">English</option>
            <option value="ben">Bengali (বাংলা)</option>
            <option value="hin">Hindi (हिन्दी)</option>
        </select>
        <label>
            <input type="checkbox" id="cleanText" checked>
            Remove unnecessary line breaks
        </label>
    </div>

    <label class="upload-area" id="uploadArea">
        <p> <strong>Click to upload Image or PDF</strong></p>
        <p style="font-size: 12px; color: #888;">(Supports JPG, PNG, PDF)</p>
        <input type="file" id="fileInput" accept="image/*,application/pdf">
    </label>
    
    <img id="imagePreview" alt="Preview">
    
    <button class="btn" id="processBtn" disabled>Extract Text</button>
    
    <div class="progress-bar" id="progressBar">
        <div class="progress" id="progress"></div>
    </div>
    
    <div class="warning" id="warningBox">
        ️ Image is too blur. Please reupload a clearer image.
    </div>
    
    <div class="output-area" id="outputArea">
        <div class="output-header">
            <h3 style="margin: 0;">Extracted Text:</h3>
            <button class="copy-btn" id="copyBtn"> Copy Text</button>
        </div>
        <textarea id="extractedText" readonly></textarea>
    </div>
</div>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const fileInput = document.getElementById('fileInput');
    const imagePreview = document.getElementById('imagePreview');
    const processBtn = document.getElementById('processBtn');
    const warningBox = document.getElementById('warningBox');
    const outputArea = document.getElementById('outputArea');
    const extractedText = document.getElementById('extractedText');
    const progressBar = document.getElementById('progressBar');
    const progress = document.getElementById('progress');
    const langSelect = document.getElementById('langSelect');
    const cleanTextCheckbox = document.getElementById('cleanText');
    const copyBtn = document.getElementById('copyBtn');

    let selectedFile = null;
    let isPdf = false;

    fileInput.addEventListener('change', (e) => {
        if (e.target.files && e.target.files[0]) {
            selectedFile = e.target.files[0];
            isPdf = selectedFile.type === 'application/pdf';
            
            if (!isPdf) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    imagePreview.src = event.target.result;
                    imagePreview.style.display = 'block';
                };
                reader.readAsDataURL(selectedFile);
            } else {
                imagePreview.style.display = 'none';
            }
            
            processBtn.disabled = false;
            warningBox.style.display = 'none';
            outputArea.style.display = 'none';
        }
    });

    langSelect.addEventListener('change', () => {
        extractedText.className = '';
        const lang = langSelect.value;
        if (lang === 'ben') extractedText.classList.add('font-bengali');
        if (lang === 'hin') extractedText.classList.add('font-hindi');
    });

    function cleanTextFormatting(text) {
        if (!cleanTextCheckbox.checked) return text;
        
        return text
            .replace(/\n{3,}/g, '\n\n')
            .replace(/([^\n])\n([^\n])/g, '$1 $2')
            .replace(/\s+([।,;:])/g, '$1')
            .replace(/([\(\["'])\s+/g, '$1')
            .replace(/\s+([\)\]"'])/g, '$1')
            .replace(/ {2,}/g, ' ')
            .split('\n')
            .map(line => line.trim())
            .join('\n')
            .trim();
    }

    // Image preprocessing for better OCR
    function preprocessImage(src) {
        return new Promise((resolve) => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                // Scale up 4x for better resolution
                const scale = 4;
                canvas.width = img.width * scale;
                canvas.height = img.height * scale;
                
                // Draw scaled image
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                
                // Get image data
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imageData.data;
                
                // Apply contrast enhancement and sharpening
                for (let i = 0; i < data.length; i += 4) {
                    // Increase contrast
                    const factor = 1.5;
                    data[i] = Math.min(255, Math.max(0, factor * (data[i] - 128) + 128));
                    data[i + 1] = Math.min(255, Math.max(0, factor * (data[i + 1] - 128) + 128));
                    data[i + 2] = Math.min(255, Math.max(0, factor * (data[i + 2] - 128) + 128));
                }
                
                ctx.putImageData(imageData, 0, 0);
                resolve(canvas.toDataURL('image/png'));
            };
            img.src = src;
        });
    }

    function getBlurScore(img) {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        const w = 100, h = 100; 
        canvas.width = w; canvas.height = h;
        ctx.drawImage(img, 0, 0, w, h);
        
        const data = ctx.getImageData(0, 0, w, h).data;
        let gray = [];
        for(let i=0; i<data.length; i+=4) {
            gray.push(0.299*data[i] + 0.587*data[i+1] + 0.114*data[i+2]);
        }
        
        let sum = 0, sumSq = 0, count = 0;
        for(let y=1; y<h-1; y++) {
            for(let x=1; x<w-1; x++) {
                let idx = y*w + x;
                let lap = gray[idx-w] + gray[idx-1] + gray[idx+1] + gray[idx+w] - 4*gray[idx];
                sum += lap; sumSq += lap*lap; count++;
            }
        }
        let mean = sum / count;
        return (sumSq / count) - (mean * mean);
    }

    async function processSingleImage(src, lang) {
        if (!isPdf) {
            const img = new Image();
            img.src = src;
            await new Promise(resolve => img.onload = resolve);
            if (getBlurScore(img) < 60) {
                throw new Error("BLUR_DETECTED");
            }
        }

        // Preprocess image for better OCR
        const processedSrc = await preprocessImage(src);

        // Create worker with explicit language loading
        const worker = await Tesseract.createWorker(lang, 1, {
            logger: m => {
                console.log(m);
                if (m.status === 'loading language traineddata') {
                    processBtn.textContent = `Loading ${lang} language data...`;
                } else if (m.status === 'initializing tesseract') {
                    processBtn.textContent = 'Initializing OCR engine...';
                } else if (m.status === 'recognizing text') {
                    progress.style.width = (m.progress * 100) + '%';
                }
            }
        });

        // Set parameters for better Bengali conjunct recognition
        await worker.setParameters({
            tessedit_pageseg_mode: 6,
            preserve_interword_spaces: 1,
            tessedit_char_whitelist: lang === 'ben' 
                ? 'অআইঈউঊঋএঐওঔকখগঘঙচছজঝঞটঠডঢণতথদধনপফবভমযরলশষসহড়ঢ়য়ৎংঃঁ০১২৩৪৫৬৭৮৯ািীুূৃেৈোৌ্ৗ।'
                : lang === 'hin'
                ? 'अआइईउऊऋएऐओऔकखगघङचछजझञटठडढणतथदधनपफबभमयरलवशषसहॠॡ०१२३४५६७८९ंःँऽािीुूृेैोौ्।'
                : undefined
        });

        const { data: { text } } = await worker.recognize(processedSrc);
        await worker.terminate();
        
        return text;
    }

    processBtn.addEventListener('click', async () => {
        if (!selectedFile) return;

        warningBox.style.display = 'none';
        processBtn.disabled = true;
        progressBar.style.display = 'block';
        processBtn.textContent = "Loading language data...";
        extractedText.value = "";
        
        const lang = langSelect.value;
        let finalText = "";

        try {
            if (isPdf) {
                const arrayBuffer = await selectedFile.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                
                for (let i = 1; i <= pdf.numPages; i++) {
                    processBtn.textContent = `Processing PDF Page ${i}/${pdf.numPages}...`;
                    const page = await pdf.getPage(i);
                    const viewport = page.getViewport({ scale: 4.0 });
                    
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;
                    
                    await page.render({ canvasContext: ctx, viewport: viewport }).promise;
                    
                    const pageText = await processSingleImage(canvas.toDataURL(), lang);
                    finalText += pageText + "\n\n";
                    progress.style.width = ((i / pdf.numPages) * 100) + '%';
                }
            } else {
                finalText = await processSingleImage(imagePreview.src, lang);
            }
            
            extractedText.value = cleanTextFormatting(finalText);
            outputArea.style.display = 'block';
            
        } catch (error) {
            if (error.message === "BLUR_DETECTED") {
                warningBox.style.display = 'block';
                outputArea.style.display = 'none';
            } else {
                console.error(error);
                alert("Error: " + error.message);
            }
        } finally {
            processBtn.disabled = false;
            processBtn.textContent = "Extract Text";
            progressBar.style.display = 'none';
            progress.style.width = '0%';
        }
    });

    copyBtn.addEventListener('click', () => {
        extractedText.select();
        document.execCommand('copy');
        copyBtn.textContent = '✓ Copied!';
        setTimeout(() => copyBtn.textContent = '📋 Copy Text', 2000);
    });
</script>

</body>
</html>
